<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYPAGE</title>
    <link rel="stylesheet" href="./signup.css">
</head>
<body>
    <div><h1 id="signup_title">MYPAGE</h1></div>
    <div id="signup_div">
        <form id="mypage_form">
            <legend>이메일 (변경)</legend>
                <input type="email" id="email" placeholder="이메일">
            <legend>비밀번호 변경 (선택)</legend>
                <input type="password" id="ud_password" placeholder="새 비밀번호 입력">
            <button id="mp_submit">정보 수정</button>
        </form>
        <button type="button" id="goback" class="mp_btn">돌아가기</button>
        <button id="delete_account" class="mp_btn">회원탈퇴</button>
    </div>
    <script src="./mypage.js"></script>
</body>
</html>
