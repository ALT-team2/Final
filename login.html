<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="./signup.css">
</head>
<body>
    <div><h1 id="signup_title">로그인</h1></div>
    <div id="signup_form">
        <form id="signup"> <!--action="/api/auth/signup" method="post"-->
        <legend>이메일</legend> 
            <input type="email" id="email" placeholder="email) test@example.com" required>
        
        <legend>비밀번호</legend>
            <input type="password" id="password" placeholder="비밀번호 입력" required>
            <div id="error_message">아이디 또는 비밀번호가 올바르지 않습니다. 입력한 정보를 다시 확인해 주세요.</div>
            <button type="button" id="cancel">로그인 취소</button>
        <button id="submit">로그인</button> <br>
        <a href="./signup.html">계정이 없으신가요?</a>
        </form>
    </div>
    <script src="./login.js"></script>
</body>
</html>
